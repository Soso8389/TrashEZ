<!DOCTYPE html>
<html>
<head>
  <title>TrashEZ</title>
  <link rel="manifest" href="manifest.json">

  <style>

    body {
      font-family: sans-serif;
      background: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 80px;
      margin-bottom: 20px;
    }

    #camera {
      width: 100%;
      max-width: 400px;
      background: #ddd;
      margin-bottom: 20px;
    }

    .scan-btn {
      width: 100%;
      max-width: 400px;
      background: #3CB44B;
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .legend {
      text-align: left;
      max-width: 400px;
      margin: 0 auto;
    }

    .legend p {
      font-size: 16px;
      margin: 8px 0;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    #popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: white;
      font-size: 20px;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }

    #popup a {
      color: white;
    }

  </style>
</head>
<body>

  <img src="logo.png" class="logo">

  <video id="camera" autoplay playsinline></video>

  <br>

  <button class="scan-btn" onclick="doScan()">Start Scan</button>

  <div class="legend">
    <p><span class="dot" style="background: #6E6E6E"></span> Trash</p>
    <p><span class="dot" style="background: #2878FF"></span> Recycling</p>
    <p><span class="dot" style="background: #3CB44B"></span> Compost</p>
    <p><span class="dot" style="background: red"></span> E-waste</p>
  </div>

  <div id="popup"></div>

  <script>

    var camera = document.getElementById("camera");
    var popup = document.getElementById("popup");

    async function startCamera() {
      var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      camera.srcObject = stream;
      await new Promise(function(resolve) {
        camera.addEventListener("loadedmetadata", resolve, { once: true });
      });
    }

    function findDropoff(item, reason) {
      navigator.geolocation.getCurrentPosition(async function(pos) {

        var response = await fetch("https://web-production-6ff8d.up.railway.app/dropoff", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude })
        });

        var data = await response.json();
        var place = data.places[0];

        var message = item + " is E-WASTE. " + reason + "<br><br>Nearest drop-off:<br><strong>" + place.displayName.text + "</strong><br>" + place.formattedAddress + "<br><br><a href='" + place.googleMapsUri + "' target='_blank'>Open in Maps</a>";

        popup.innerHTML = message;
      });
    }

    async function doScan() {

      await startCamera();

      var canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      canvas.getContext("2d").drawImage(camera, 0, 0, 1024, 1024);

      var imageData = canvas.toDataURL("image/jpeg", 0.8);
      var base64 = imageData.split(",")[1];

      var response = await fetch("https://web-production-6ff8d.up.railway.app/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64 })
      });

      var result = await response.json();
      var bin = result.bin;
      var item = result.item;
      var reason = result.reason;

      if (bin === "trash") {
        new Audio("Trash.mp3").play();
        popup.style.background = "#6E6E6E";
        popup.innerHTML = item + " goes in TRASH. " + reason;
        popup.style.display = "block";
        setTimeout(function() { popup.style.display = "none"; }, 7000);
      }

      else if (bin === "recycling") {
        new Audio("Recycling.mp3").play();
        popup.style.background = "#2878FF";
        popup.innerHTML = item + " goes in RECYCLING. " + reason;
        popup.style.display = "block";
        setTimeout(function() { popup.style.display = "none"; }, 7000);
      }

      else if (bin === "compost") {
        new Audio("Compost.mp3").play();
        popup.style.background = "#3CB44B";
        popup.innerHTML = item + " goes in COMPOST. " + reason;
        popup.style.display = "block";
        setTimeout(function() { popup.style.display = "none"; }, 7000);
      }

      else if (bin === "E-waste") {
        new Audio("E-waste.mp3").play();
        popup.style.background = "red";
        popup.innerHTML = item + " is E-WASTE. " + reason + "<br><br>Finding nearest drop-off...";
        popup.style.display = "block";
        setTimeout(function() { popup.style.display = "none"; }, 15000);
        findDropoff(item, reason);
      }

      else {
        new Audio("unidentified.mp3").play();
        popup.style.background = "#333";
        popup.innerHTML = "Could not identify, please try again!";
        popup.style.display = "block";
        setTimeout(function() { popup.style.display = "none"; }, 7000);
      }
    }

  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>TrashEZ</title>
  <link rel="manifest" href="manifest.json">

  <style>

    body {
      font-family: sans-serif;
      background: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 80px;
      margin-bottom: 20px;
    }

    #camera {
      width: 100%;
      max-width: 400px;
      background: #ddd;
      margin-bottom: 20px;
    }

    .scan-btn {
      width: 100%;
      max-width: 400px;
      background: #3CB44B;
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .legend {
      text-align: left;
      max-width: 400px;
      margin: 0 auto;
    }

    .legend p {
      font-size: 16px;
      margin: 8px 0;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    #popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: white;
      font-size: 20px;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }

  </style>
</head>
<body>

  <img src="logo.png" class="logo">

  <video id="camera" autoplay playsinline></video>

  <br>

  <button class="scan-btn" onclick="doScan()">Start Scan</button>

  <div class="legend">
    <p><span class="dot" style="background: #6E6E6E"></span> Trash</p>
    <p><span class="dot" style="background: #2878FF"></span> Recycling</p>
    <p><span class="dot" style="background: #3CB44B"></span> Compost</p>
    <p><span class="dot" style="background: red"></span> E-waste</p>
  </div>

  <div id="popup"></div>

  <script>

    var cameraVideo = document.getElementById("camera");
    var popup = document.getElementById("popup");

    async function turnOnCamera() {
      var stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      cameraVideo.srcObject = stream;
      await new Promise(function(resolve) {
        cameraVideo.addEventListener("loadedmetadata", resolve, { once: true });
      });
    }

    async function doScan() {

      await turnOnCamera();

      var canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      canvas.getContext("2d").drawImage(cameraVideo, 0, 0, 1024, 1024);

      var imageData = canvas.toDataURL("image/jpeg", 0.8);
      var base64 = imageData.split(",")[1];

      var response = await fetch("https://web-production-6ff8d.up.railway.app/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64 })
      });

      var result = await response.json();

      if (result.bin === "trash") {
        popup.style.background = "#6E6E6E";
        new Audio("Trash.mp3").play();
      } else if (result.bin === "recycling") {
        popup.style.background = "#2878FF";
        new Audio("Recycling.mp3").play();
      } else if (result.bin === "compost") {
        popup.style.background = "#3CB44B";
        new Audio("Compost.mp3").play();
      } else if (result.bin === "E-waste") {
        popup.style.background = "red";
        new Audio("E-waste.mp3").play();
      } else {
        popup.style.background = "#333";
        new Audio("unidentified.mp3").play();
      }

      if (result.bin === "unknown") {
        popup.textContent = "Could not identify, please try again!";
      } else {
        popup.textContent = result.item + " goes in " + result.bin.toUpperCase() + ". " + result.reason;
      }

      popup.style.display = "block";

      setTimeout(function() {
        popup.style.display = "none";
      }, 7000);
    }

  </script>

</body>
</html>

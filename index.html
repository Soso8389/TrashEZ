<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrashEZ</title>

  <style>

    /* page background */
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* white phone card */
    .app {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }

    .logo img {
      height: 60px;
      margin-bottom: 20px;
    }

    /* camera box */
    .camera-box {
      width: 100%;
      aspect-ratio: 1;
      border: 2px dashed #bbb;
      border-radius: 16px;
      background: #fafafa;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .camera-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* green scan button */
    .scan-btn {
      width: 100%;
      background: #3CB44B;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .scan-btn:active {
      background: #2e9e3a;
    }

    /* bin list */
    .results-list {
      list-style: none;
      padding: 0;
      text-align: left;
    }

    .results-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-trash     { background: #6E6E6E; }
    .dot-recycling { background: #2878FF; }
    .dot-compost   { background: #3CB44B; }
    .dot-hazard    { background: red;     }

    /* intro video overlay */
    #introOverlay {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      overflow: hidden;
      background: black;
      z-index: 999;
    }

    #introOverlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #popup {
     position: absolute;
     inset: 0;
     border-radius: 24px;
     display: none;
     flex-direction: column;
     justify-content: center;
     align-items: center;
     text-align: center;
     color: white;
     font-size: 22px;
     font-weight: 600;
     padding: 30px;
     z-index: 998;
    white-space: pre-wrap;

}

#popup.show {
  display: flex;
}

  </style>
</head>
<body>

  <div class="app">

    <!-- intro video that plays when the app opens -->
    <div id="introOverlay">
      <video id="introVideo" src="intro.mp4" autoplay playsinline muted></video>
    </div>

    <div class="logo">
      <img src="logo.png" alt="TrashEZ Logo">
    </div>

    <!-- live camera shows up here -->
    <div class="camera-box">
      <video id="camera" autoplay playsinline></video>
    </div>

  <button class="scan-btn" onclick="startScanFlow()">Start Scan</button>

    <ul class="results-list">
      <li><span class="dot dot-trash"></span>     <u>Trash</u></li>
      <li><span class="dot dot-recycling"></span> <u>Recycling</u></li>
      <li><span class="dot dot-compost"></span>   <u>Compost</u></li>
      <li><span class="dot dot-hazard"></span>    <u>E-waste</u></li>
    </ul>
    
    
    <div id="popup">ß
   </div>
  
  
  
  </div>

  <script>
   async function startScanFlow() {
    await startCamera();
    scan();
   }

    

// hide the intro video when it finishes
    const introVideo = document.getElementById("introVideo");
    const introOverlay = document.getElementById("introOverlay");

    introVideo.addEventListener("ended", () => {
      introOverlay.style.display = "none";
    });


    // turn on the camera
    const camera = document.getElementById("camera");

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      camera.srcObject = stream;
      await new Promise(resolve => camera.addEventListener("loadedmetadata", resolve, { once: true }));

    }


    // take a picture and send it to the server
    async function scan() {

      // make a small picture from the camera
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = Math.round(camera.videoHeight * (512 / camera.videoWidth));
      canvas.getContext("2d").drawImage(camera, 0, 0, canvas.width, canvas.height);

      // turn the picture into text we can send
      const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];

      // send the picture to the server
      const response = await fetch("https://web-production-6ff8d.up.railway.app/classify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64 })
      });

      const result = await response.json();

      // show the answer
      const colors = {
        trash: "#6E6E6E",
        recycling: "#2878FF",
        compost: "#3CB44B",
        "E-waste": "#FF0000"
      };

        const popup = document.getElementById("popup");

          if (result.bin === "unknown") {
            new Audio("unidentified.mp3").play();
            popup.style.background = "#333";
            popup.textContent = "Unidentified item — please try again!";
          }
        else {
          new Audio(result.bin + ".mp3").play();
          popup.style.background = colors[result.bin];
          popup.textContent = `${result.item} → ${result.bin.toUpperCase()}\n${result.reason}`;
          }

          popup.classList.add("show");

          setTimeout(() => {
          popup.classList.remove("show");
          }, 3000);
    }

  </script>

</body>
</html>
